<svg xmlns="http://www.w3.org/2000/svg" width="800" height="40" viewBox="0 0 800 40" role="img" aria-labelledby="title">
  <title id="title">Building AI applications, creative tools, and useful web experiences</title>
  <style>
    text {font-family: Consolas, 'Liberation Mono', monospace; font-size:17px; fill:#29BFD0; text-anchor:middle;}
    .line {opacity:0; animation: cycle 12s infinite;}
    .second {animation-delay:4s;}
    .third {animation-delay:8s;}
    @keyframes cycle {0%,30% {opacity:1;} 33%,100% {opacity:0;}}
    @media (prefers-reduced-motion: reduce) {.line {animation:none;} .first {opacity:1;}}
  </style>
  <text x="400" y="26" class="line first">&gt; Building AI applications that people can use.</text>
  <text x="400" y="26" class="line second">&gt; From Python backends to thoughtful interfaces.</text>
  <text x="400" y="26" class="line third">&gt; Exploring computer vision, LLMs &amp; creative AI.</text>
</svg>
