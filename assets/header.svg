    <clipPath id="bounds"><rect x="1" y="1" width="958" height="278" rx="16"/></clipPath>
  </defs>
  <style>
    text {font-family: 'Segoe UI', Arial, sans-serif;}
    .mono {font-family: Consolas, 'Liberation Mono', monospace;}
    .signal {animation: pulse 3s ease-in-out infinite;}
    @keyframes pulse {0%,100% {opacity:.45;} 50% {opacity:1;}}
    @media (prefers-reduced-motion: reduce) {.signal {animation:none;}}
  </style>
  <g clip-path="url(#bounds)">
