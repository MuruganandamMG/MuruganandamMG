<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Muruganandam M G</title>
  <desc id="description">AI Developer and Full Stack Developer. Machine learning, language models, and creative tools.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="960" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111E"/><stop offset="1" stop-color="#101C30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="960" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00D9E8"/><stop offset="0.6" stop-color="#4387FF"/><stop offset="1" stop-color="#8B78EF"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#7BBDD7" stroke-opacity=".055"/>
