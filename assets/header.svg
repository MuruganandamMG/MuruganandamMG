    <circle cx="819" cy="163" r="3" fill="#4387FF" fill-opacity=".8"/>
    <rect x="351" y="30" width="258" height="29" rx="14.5" fill="#00D9E8" fill-opacity=".07" stroke="#00D9E8" stroke-opacity=".3"/>
